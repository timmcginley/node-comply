services:
  # Keep the existing Render resource identity when updating node-comply.
  - type: web
    name: masterbpmn
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run validate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPECKLE_APP_ID
        sync: false
      - key: SPECKLE_REDIRECT_URL
        value: https://tools.boxbuild.dk/speckle/callback
